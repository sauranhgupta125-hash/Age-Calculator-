<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Age Calculator</title>

<style>
body{
    margin:0;
    background:#0f172a;
    font-family:Arial,sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1e293b;
    padding:30px;
    border-radius:15px;
    width:350px;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="box">
<h2>Live Age Calculator</h2>

<input type="datetime-local" id="dob">

<br>

<button onclick="start()">Calculate</button>

<div id="result"></div>

</div>

<script>

let timer;

function start(){

clearInterval(timer);

let dob=new Date(document.getElementById("dob").value);

timer=setInterval(()=>{

let now=new Date();

let diff=now-dob;

if(diff<0){
document.getElementById("result").innerHTML="Invalid Date";
return;
}

let seconds=Math.floor(diff/1000);
let minutes=Math.floor(seconds/60);
let hours=Math.floor(minutes/60);
let days=Math.floor(hours/24);

let years=Math.floor(days/365.25);
let months=Math.floor((days%365.25)/30.44);

document.getElementById("result").innerHTML=`
<b>${years}</b> Years<br>
<b>${months}</b> Months<br>
<b>${days}</b> Days<br>
<b>${hours}</b> Hours<br>
<b>${minutes}</b> Minutes<br>
<b>${seconds}</b> Seconds
`;

},1000);

}

</script>

</body>
</html>
